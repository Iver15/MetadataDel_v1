name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test core
        run: dotnet test MetadataDel.Core.Tests/MetadataDel.Core.Tests.csproj -c Release

      - name: Publish self-contained exe
        run: >
          dotnet publish MetadataDel.Cli/MetadataDel.Cli.csproj
          -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:SelfContained=true
          -o ./publish

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          [xml]$project = Get-Content MetadataDel.Cli/MetadataDel.Cli.csproj
          ./installer/msi/build-msi.ps1 -Version $project.Project.PropertyGroup.Version

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          installer\MetadataDel.iss

      - name: Create ZIP distribution
        run: Compress-Archive -Path publish\* -DestinationPath MetadataDel-win-x64.zip

      - name: Verify ZIP layout
        shell: pwsh
        run: |
          Expand-Archive MetadataDel-win-x64.zip -DestinationPath zip-check
          foreach ($file in @('MetadataDel.exe', 'app.ico')) {
            if (-not (Test-Path (Join-Path zip-check $file))) { throw "Missing distribution file: $file" }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetadataDel-Setup
          path: installer/MetadataDel-Setup-*.exe

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetadataDel-MSI
          path: installer/msi/MetadataDel-*.msi
          if-no-files-found: error

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetadataDel-win-x64
          path: MetadataDel-win-x64.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/MetadataDel-Setup-*.exe
            MetadataDel-win-x64.zip
            installer/msi/MetadataDel-*.msi
            publish/MetadataDel.exe
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
