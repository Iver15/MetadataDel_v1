name: Test
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build MetaDataDel.sln -c Release
      - run: dotnet test MetadataDel.Core.Tests/MetadataDel.Core.Tests.csproj -c Release --no-build
      - if: runner.os == 'macOS'
        run: python3 scripts/tests/smoke.py
      - if: runner.os == 'macOS'
        name: Native desktop contracts
        run: |
          clang -fobjc-arc -framework Cocoa -I scripts/mac/app scripts/tests/mac-runner-tests.m scripts/mac/app/CleaningRunner.m -o /tmp/runner-tests
          /tmp/runner-tests
          clang -fobjc-arc -framework Foundation -I scripts/mac/app scripts/tests/mac-integration-state-tests.m scripts/mac/app/IntegrationManager.m -o /tmp/state-tests
          /tmp/state-tests
          clang -fobjc-arc -framework Cocoa -framework UniformTypeIdentifiers -I scripts/mac/app scripts/tests/mac-ui-state-tests.m scripts/mac/app/CleaningRunner.m scripts/mac/app/FileDropView.m scripts/mac/app/IntegrationManager.m scripts/mac/app/SettingsWindow.m -o /tmp/ui-state-tests
          /tmp/ui-state-tests
          bash scripts/tests/mac-ownership-tests.sh
          bash scripts/tests/mac-integration-tests.sh
