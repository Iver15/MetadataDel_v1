name: Test
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build MetaDataDel.sln -c Release
      - run: dotnet test MetadataDel.Core.Tests/MetadataDel.Core.Tests.csproj -c Release --no-build
      - if: runner.os == 'macOS'
        run: python3 scripts/tests/smoke.py
